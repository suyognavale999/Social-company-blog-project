{% extends 'base.html' %}

{% block content %}
<div class="jumbotron">
    <h1 class="display-4">{{ post.title }}</h1>
    <h4 class="text-muted">Written by: {{ post.author.username }}</h4>
    <h5 class="text-muted">Published: {{ post.date.strftime('%B %d, %Y') }}</h5>
    <hr class="my-4">
    <p class="preserve-format">{{ post.text }}</p>

    {% if post.author == current_user %}

<div class="mt-4 d-flex">
    <a href="{{ url_for('blog_posts.update', blog_post_id=post.id) }}" class="btn btn-outline-primary btn-sm mr-2">Update</a>
    <a href="{{ url_for('blog_posts.confirm_delete', blog_post_id=post.id) }}" class="btn btn-outline-danger btn-sm">Delete</a>
</div>
