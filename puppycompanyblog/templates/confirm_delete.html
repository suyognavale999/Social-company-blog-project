{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 text-center">
  <h3>Are you confirm to delete this post?</h3>
  <p><strong>{{ post.title }}</strong> by {{ post.author.username }}</p>

  <form method="POST" class="mt-4">
    <button type="submit" class="btn btn-danger btn-lg mr-3">Yes, Delete</button>
    <a href="{{ url_for('blog_posts.blog_post', blog_post_id=post.id) }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
  </form>
</div>
{% endblock %}
