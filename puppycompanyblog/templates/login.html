{% extends "base.html" %}
{% block content %}

<div class="auth-form">
    <h2>Login</h2>
    <form method="POST">
        {{ form.hidden_tag() }}

        <label for="email">{{ form.email.label }}</label>
        {{ form.email }}

        <label for="password">{{ form.password.label }}</label>
        {{ form.password }}

        {{ form.submit() }}
    </form>
</div>

{% endblock %}
