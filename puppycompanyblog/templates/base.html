<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/account.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/blog.css') }}">

    <!-- Bootstrap CSS only -->
<!--    https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css-->
</head>
<body>

<ul class="nav">
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('core.index') }}">Home</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('core.info') }}">About</a>
    </li>

    {% if current_user.is_authenticated %}
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('users.logout') }}">Log out</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('users.account') }}">Account</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('blog_posts.create_post') }}">Create Post</a>
    </li>
    {% else %}
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('users.login') }}">Log in</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{{ url_for('users.register') }}">Register</a>
    </li>
    {% endif %}
</ul>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<footer class="bg-light text-center text-lg-start mt-5">
    <div class="text-center p-3 font-weight-bold" style="background-color: #f8f9fa;">
        © {{ current_year }} <span class="text-primary"> Blog : {{title}}-</span> All rights reserved!
    </div>
</footer>

</body>
</html>
